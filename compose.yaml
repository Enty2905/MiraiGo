services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miraigo}
      POSTGRES_USER: ${POSTGRES_USER:-miraigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miraigo_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - miraigo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  miraigo-postgres:
